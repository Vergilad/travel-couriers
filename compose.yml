services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: peregri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: peregri
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://peregri:${POSTGRES_PASSWORD}@db:5432/peregri
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

volumes:
  pgdata:
